<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#fbf6ef" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg?v=2" />
    <title>Página no encontrada | B Lance by ROMI</title>
    <style>
      :root { color: #252238; background: #fbf6ef; font-family: "Avenir Next", "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; min-height: 100vh; background: radial-gradient(circle at 82% 18%, #eee9ff 0, transparent 28%), radial-gradient(circle at 12% 82%, #ddf7ed 0, transparent 26%), #fbf6ef; }
      a { color: inherit; text-decoration: none; }
      a:focus-visible { outline: 3px solid #ffd972; outline-offset: 4px; }
      .shell { width: min(1100px, calc(100% - 40px)); margin: 0 auto; }
      header { display: flex; min-height: 88px; align-items: center; justify-content: space-between; }
      .brand { display: flex; align-items: center; gap: 11px; font-weight: 800; }
      .brand i { display: grid; width: 42px; height: 42px; place-items: center; border-radius: 15px 11px 15px 12px; background: #252238; color: white; font-style: normal; }
      .brand span { font-size: 1.1rem; letter-spacing: -.04em; }
      .brand small { margin-left: 6px; color: #cf4057; font-size: .62rem; letter-spacing: .08em; text-transform: uppercase; }
      header > a:last-child { font-size: .82rem; font-weight: 700; }
      main { display: grid; min-height: calc(100vh - 88px); align-items: center; grid-template-columns: .85fr 1fr; gap: clamp(46px, 8vw, 110px); padding-block: 60px 110px; }
      .visual { position: relative; display: grid; width: min(410px, 80vw); aspect-ratio: 1; place-items: center; border: 1px solid rgba(37,34,56,.12); border-radius: 50%; background: rgba(255,255,255,.48); box-shadow: 0 28px 70px rgba(37,34,56,.1); }
      .visual::before, .visual::after { position: absolute; border-radius: 50%; content: ""; }
      .visual::before { inset: 14%; border: 1px solid rgba(37,34,56,.14); }
      .visual::after { width: 18%; aspect-ratio: 1; top: 11%; right: 15%; background: #f06a78; box-shadow: 0 0 0 16px rgba(240,106,120,.12); }
      .visual strong { color: #252238; font-size: clamp(5rem, 13vw, 9rem); letter-spacing: -.1em; line-height: 1; }
      .eyebrow { margin: 0 0 16px; color: #cf4057; font-size: .75rem; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
      h1 { max-width: 650px; margin: 0; font-size: clamp(3.2rem, 6.5vw, 6rem); letter-spacing: -.07em; line-height: .95; }
      .copy > p:not(.eyebrow) { max-width: 530px; margin: 24px 0 0; color: #4f4a61; font-size: 1.06rem; line-height: 1.65; }
      .actions { display: flex; flex-wrap: wrap; gap: 11px; margin-top: 32px; }
      .button { display: inline-flex; min-height: 52px; align-items: center; justify-content: center; border: 1px solid rgba(37,34,56,.15); border-radius: 999px; padding: 0 22px; font-weight: 750; }
      .button:first-child { border-color: #252238; background: #252238; color: white; box-shadow: 0 10px 24px rgba(37,34,56,.18); }
      .note { display: block; margin-top: 22px; color: #756f80; font-size: .72rem; }
      @media (max-width: 760px) { main { grid-template-columns: 1fr; padding-block: 35px 70px; } .visual { width: min(270px, 72vw); } h1 { font-size: clamp(3.2rem, 15vw, 4.6rem); } .actions { display: grid; } }
      @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
    </style>
  </head>
  <body>
    <header class="shell">
      <a class="brand" href="/" aria-label="B Lance by ROMI, ir al inicio"><i>B</i><span>B Lance <small>by ROMI</small></span></a>
      <a href="/">Volver al inicio</a>
    </header>
    <main class="shell">
      <div class="visual" aria-hidden="true"><strong>404</strong></div>
      <div class="copy">
        <p class="eyebrow">Esta ruta no está disponible</p>
        <h1>Parece que esta página perdió el equilibrio.</h1>
        <p>No hiciste nada mal. Regresa al inicio y retomamos desde un lugar conocido.</p>
        <div class="actions"><a class="button" href="/">← Volver al inicio</a><a class="button" href="tel:8009112000">Necesito apoyo</a></div>
        <small class="note">Si hay peligro inmediato, llama al 911.</small>
      </div>
    </main>
  </body>
</html>
